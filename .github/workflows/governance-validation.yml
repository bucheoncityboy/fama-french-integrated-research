name: Governance empirical validation
on:
  push:
    paths: ['korea-market/governance-extension/**', '.github/workflows/governance-validation.yml']
  pull_request:
    paths: ['korea-market/governance-extension/**', '.github/workflows/governance-validation.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: korea-market/governance-extension/requirements.txt
      - run: python -m pip install -r korea-market/governance-extension/requirements.txt
      - run: python -m pytest -q korea-market/governance-extension/tests
      - run: python -m compileall -q korea-market/governance-extension/src
      - run: python -m src.cli verify-public
        working-directory: korea-market/governance-extension
